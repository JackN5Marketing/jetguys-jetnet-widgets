<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>JetGuys JETNET widgets — local preview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; background: #fff; color: #111; }
    h1 { font-size: 20px; }
    .stack { display: flex; flex-direction: column; gap: 24px; margin-top: 24px; }
  </style>
</head>
<body>
  <h1>JETNET widgets — local preview</h1>
  <p>Search for a model (e.g. "Excel", "Citation", "G650") in each widget to test the live data flow through the Netlify functions. Three independent widgets, stacked.</p>

  <div class="stack">
    <div data-jng-market-trends data-api-base="/.netlify/functions"></div>
    <div data-jng-events data-api-base="/.netlify/functions"></div>
    <div data-jng-history data-api-base="/.netlify/functions"></div>
  </div>

  <script src="/widget-market-trends.js"></script>
  <script src="/widget-events.js"></script>
  <script src="/widget-history.js"></script>
</body>
</html>
